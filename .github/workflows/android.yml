name: Build Android app
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease && cp app/build/outputs/apk/release/app-release.apk ../parkle.apk
      - name: Publish the APK as the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: Parkle app ${{ github.run_number }}
          body: Install parkle.apk on Android. The game inside updates itself from GitHub Pages.
          files: parkle.apk
          make_latest: true
